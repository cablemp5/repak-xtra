<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:,">
  <title>repakxtra</title>
  <style>
    @font-face {
      font-family: 'BBH Bartle';
      src: url('/src/styles/fonts/BBHBartle-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: #141414;
      color: #e6e6e6;
    }

    .splash-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #141414 0%, #1a1a1a 50%, #1f1f1f 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      overflow: hidden;
      z-index: 9999;
      user-select: none;
      -webkit-user-select: none;
    }

    .splash-content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 3rem;
      max-width: 480px;
      width: 100%;
    }

    .logo-container {
      margin-bottom: 2rem;
      position: relative;
    }

    .splash-logo {
      font-family: 'BBH Bartle', sans-serif;
      font-size: 2.4rem;
      font-weight: 300;
      color: #ffffff;
    }

    .subtitle {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-top: 0.5rem;
    }

    .icon-container {
      margin: 2.5rem 0;
      position: relative;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app-icon {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      position: relative;
      z-index: 2;
    }

    .status {
      margin-bottom: 1.5rem;
    }

    .status-text {
      font-size: 1.25rem;
      font-weight: 500;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .status-detail {
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.6;
    }

    .splash-progress-container {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 2rem;
    }

    .splash-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #dc2626, #b91c1c, #991b1b);
      border-radius: 2px;
    }

    .splash-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
    }

    @keyframes initProgress {
      0% {
        width: 0%;
      }

      100% {
        width: 100%;
      }
    }
  </style>
  <style>
    /* repakxtra: quiet splash in the app's look (no red, no logo art) */
    @font-face { font-family: 'Geist'; src: url('/src/custom/fonts/Geist-Variable.ttf') format('truetype'); font-weight: 100 900; font-display: block; }
    .splash-container { background: #0a0a0a !important; }
    .splash-card { background: transparent !important; border: none !important; box-shadow: none !important; }
    .splash-logo { font-family: 'Geist', sans-serif !important; font-weight: 900 !important; font-size: 2.6rem !important; letter-spacing: -0.03em; }
    .splash-x { color: #346bf1; }
    /* Test and dev copies (the script below sets data-build): "xtra" in their color and a quiet line naming the build */
    html[data-build="test"] .splash-x { color: #3ecf6e; }
    html[data-build="dev"] .splash-x { color: #f5a524; }
    .splash-build { display: none; margin-top: 0.35rem; font: 500 0.75rem/1 'Geist', sans-serif; letter-spacing: 0.02em; }
    html[data-build] .splash-build { display: block; }
    html[data-build="test"] .splash-build { color: #3ecf6e; }
    html[data-build="dev"] .splash-build { color: #f5a524; }
    .subtitle, .icon-container, .status-detail { display: none !important; }
    .status-text { font-family: 'Geist', sans-serif; font-size: 0.875rem !important; font-weight: 400 !important; color: #8f8f8f !important; margin-top: 1rem; }
    .splash-progress-container { height: 2px !important; max-width: 200px; margin: 1.5rem auto 0 !important; background: rgba(255, 255, 255, 0.08) !important; }
    .splash-progress-bar { background: #ededed !important; }
    /* transitions.dev: Texts reveal. The name and the status line rise in from a blur, the second a beat later */
    @keyframes t-texts-reveal { from { opacity: 0; transform: translateY(12px); filter: blur(3px); } }
    .splash-logo, .status-text { animation: t-texts-reveal 500ms cubic-bezier(0.22, 1, 0.36, 1) backwards; }
    .status-text { animation-delay: 90ms; }
    html[data-motion="off"] .splash-logo, html[data-motion="off"] .status-text, html[data-motion="off"] .splash-progress-bar { animation: none !important; }
  </style>
  <script>
    // repakxtra: Settings > Animations before the splash paints, the same rule as resolveMotion in custom/uiPrefs.tsx:
    // a saved '1' or '0' wins, anything else (System) follows the Windows reduce motion setting
    try {
      var motion = localStorage.getItem('repakxtra.motion');
      var motionOn = motion === '1' ? true : motion === '0' ? false : !matchMedia('(prefers-reduced-motion: reduce)').matches;
      document.documentElement.setAttribute('data-motion', motionOn ? 'on' : 'off');
    } catch (e) { }
  </script>
</head>

<body>
  <div id="splash-screen" class="splash-container">

    <div class="splash-content">
      <div class="splash-card">
        <div class="logo-container">
          <div class="splash-logo">repak<span class="splash-x">xtra</span></div>
          <div class="splash-build"></div>
          <div class="subtitle">Mod Installer</div>
        </div>
        <div class="icon-container">
          <img src="/src/assets/app-icons/RepakIcon-x512.png" alt="Repak X" class="app-icon">
        </div>
        <div class="status">
          <div class="status-text">Initializing...</div>
          <div class="status-detail">Preparing your environment...</div>
        </div>
        <div class="splash-progress-container">
          <div class="splash-progress-bar" style="animation: initProgress 2s linear"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="root"></div>
  <script>
    // Hide the splash immediately for secondary windows. Only App.tsx clears
    // it, and secondary windows never render App - so a route missing from this
    // list keeps a full-screen overlay parked on top of a window that did load.
    // Keep in sync with the route checks in src/main.tsx.
    // repakxtra: test and dev copies mark the splash like the header (custom/version.ts). Vite fills in %MODE% and
    // %VITE_REPAKXTRA_TEST% when it serves or builds this page (an unset one stays as written, so it never matches)
    var BUILD = '%MODE%' === 'development' ? 'dev' : '%VITE_REPAKXTRA_TEST%' === '1' ? 'test' : '';
    if (BUILD) {
      document.documentElement.setAttribute('data-build', BUILD);
      document.querySelector('.splash-build').textContent = BUILD + ' build';
    }
    var SECONDARY_WINDOW_ROUTES = ['vfx-updater', 'asset-explorer', '/encrypt', '/galacta'];
    if (SECONDARY_WINDOW_ROUTES.some(function (route) {
      return window.location.href.includes(route);
    })) {
      document.getElementById('splash-screen').style.display = 'none';
    }
  </script>
  <script type="module" src="/src/main.tsx"></script>
  <!-- <script src="http://localhost:8097"></script>  React DevTools -->
</body>

</html>
