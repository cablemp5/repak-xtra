[workspace]
resolver = "2"
members = ["repak-x", "uasset_toolkit/uasset_app"]

[workspace.package]
repository = "https://github.com/XzantGaming/Repak-X"
authors = ["Xzant", "Saturn"]
license = "GPL-3.0"
version = "2.2.0"
edition = "2021"
keywords = ["marvel-rivals","unreal-engine", "pak", "unrealpak"]


[profile.release]
lto = "thin"
strip = true
opt-level = 3

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[profile.dev]
incremental = true
codegen-units = 256
lto = false
opt-level = 1
debug = 1

# repakxtra: dependencies are built optimized once, so the dev copy's timings match a release build's (a mod update
# took 46 s in the dev copy at level 0 and 14.5 s with this, as in a release build). Only the app crate rebuilds on an edit
[profile.dev.package."*"]
opt-level = 3