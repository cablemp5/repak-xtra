# repakxtra: the checks every pull request into main must pass before it can merge (typecheck, frontend build,
# self-checks, Rust tests). Also runs on pushes to main so the branch's own state stays visible.
name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Typecheck, build and test (${{ matrix.edition }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        edition: [standard, extended]
    env:
      VITE_REPAKXTRA_EDITION: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repak-x/package-lock.json

      - name: Install frontend dependencies
        working-directory: repak-x
        run: npm ci

      - name: Typecheck
        working-directory: repak-x
        run: npx tsc --noEmit -p .

      # repakxtra: runs the console.assert self-checks in src (dev-only in the app) and fails on any miss
      - name: Frontend self-checks
        working-directory: repak-x
        run: npm run test:unit

      - name: Edition access, appearance and release-note checks
        working-directory: repak-x
        run: npm run test:editions

      # The Rust app embeds the built frontend, so it is built before the tests
      - name: Build frontend
        working-directory: repak-x
        run: npm run build

      - name: Check shipped edition boundaries
        working-directory: repak-x
        run: node scripts/check-edition.mjs

      # Fake files test embedding/selection without distributing Sigeon or using a real unlock hash.
      # These jobs only run tests; no executable or archive is published.
        if: matrix.edition == 'extended'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression, System.IO.Compression.FileSystem
          $resourceDir = Join-Path $PWD 'repak-x/resources/extended'
          $archivePath = Join-Path $resourceDir 'ProjectSigeon.zip'
          $hashPath = Join-Path $resourceDir 'activation.sha256'
          if ((Test-Path -LiteralPath $archivePath) -or (Test-Path -LiteralPath $hashPath)) {
            throw 'Refusing to replace existing edition resources with test fixtures.'
          }
          New-Item -ItemType Directory -Force -Path $resourceDir | Out-Null
          $archive = [IO.Compression.ZipFile]::Open($archivePath, [IO.Compression.ZipArchiveMode]::Create)
          try {
            foreach ($variant in @('Minimal', 'Splash', 'Settings', 'Splash + Settings')) {
              foreach ($extension in @('pak', 'utoc', 'ucas')) {
                $entry = $archive.CreateEntry("$variant/!ProjectSigeon_9999999_P.$extension")
                $stream = $entry.Open()
                try {
                  $bytes = [Text.Encoding]::UTF8.GetBytes("CI fixture only: $variant $extension")
                  $stream.Write($bytes, 0, $bytes.Length)
                } finally { $stream.Dispose() }
              }
            }
          } finally { $archive.Dispose() }
          $sha = [Security.Cryptography.SHA256]::Create()
          try {
            $bytes = $sha.ComputeHash([Text.Encoding]::UTF8.GetBytes('fixture-only'))
            $hash = ([BitConverter]::ToString($bytes)).Replace('-', '').ToLowerInvariant()
            [IO.File]::WriteAllText($hashPath, $hash)
          } finally { $sha.Dispose() }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: checks-${{ runner.os }}-${{ matrix.edition }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: checks-${{ runner.os }}-${{ matrix.edition }}-

      - name: Rust tests
        env:
          SKIP_UASSET_TOOL_BUILD: '1'   # the .NET asset tool is only needed to package, not to test
        run: |
          if ('${{ matrix.edition }}' -eq 'extended') {
            cargo test --locked -p repak-x --bin REPAK-X --features extended
          } else {
            cargo test --locked -p repak-x --bin REPAK-X
          }

      - name: Native wrapper tests
        run: cargo test --locked -p uasset_app --lib

  # Keep the existing branch-protection check name while requiring both edition jobs.
  required-checks:
    name: Typecheck, build and test
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Require both editions to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success
