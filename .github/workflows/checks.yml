# repakxtra: the checks every pull request into main must pass before it can merge (typecheck, frontend build,
# self-checks, Rust tests). Also runs on pushes to main so the branch's own state stays visible.
name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Typecheck, build and test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repak-x/package-lock.json

      - name: Install frontend dependencies
        working-directory: repak-x
        run: npm ci

      - name: Typecheck
        working-directory: repak-x
        run: npx tsc --noEmit -p .

      # repakxtra: runs the console.assert self-checks in src (dev-only in the app) and fails on any miss
      - name: Frontend self-checks
        working-directory: repak-x
        run: npm run test:unit

      # The Rust app embeds the built frontend, so it is built before the tests
      - name: Build frontend
        working-directory: repak-x
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: checks-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: checks-${{ runner.os }}-

      - name: Rust tests
        env:
          SKIP_UASSET_TOOL_BUILD: '1'   # the .NET asset tool is only needed to package, not to test
        run: cargo test --locked -p repak-x --bin REPAK-X

      - name: Native wrapper tests
        run: cargo test --locked -p uasset_app --lib

  # repakxtra: builds the native asset tool from the submodule and runs its extraction checks against made-up PAKs
  # (paths that leave the output folder, a junction, a partial write). Fails when the submodule lacks the fixes.
  native:
    name: Native tool checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build the CLI tool and check its path rules
        run: |
          dotnet build UAssetToolRivals/src/UAssetTool/UAssetTool.csproj -c Release -o target/uat-cli
          target/uat-cli/UAssetTool.exe self_test_paths

      - name: Build the NativeAOT library
        run: dotnet publish UAssetToolRivals/src/UAssetTool/UAssetToolNative.csproj -c Release -r win-x64 -p:DebugType=none -p:DebugSymbols=false -o target/uassettool

      - name: Native extraction checks
        run: python repak-x/scripts/check-native-extract.py target/uassettool/UAssetTool.dll
